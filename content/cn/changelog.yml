versions:
  - name: v2.0.25
    date: '2026-07-23'
    products:
      cloud:
        Bug Fixes:
          - type: 事件记忆
            changedInfo:
              - 修复事件记忆未截断导致模型输入过长报错问题
      opensource:
        Improvements:
          - type: MMR 优化
            changedInfo:
              - MMR优化：对MMR候选进行剪枝，减少相似度矩阵计算时延
        Bug Fixes:
          - type: feedback 模型解析
            changedInfo:
              - 修复feedback中模型解析失败问题
          - type: 模型配置项
            changedInfo:
              - 统一简化模型相关配置项
          - type: embedder 日志
            changedInfo:
              - embedder日志问题修复
          - type: SDK get_task_status
            changedInfo:
              - 修复 SDK get_task_status() 无法解析旧版任务状态响应的问题
  - name: v2.0.24
    date: '2026-07-16'
    products:
      cloud:
        New Features:
          - type: 云服务
            changedInfo:
              - 属性树
              - 事件记忆
              - 多视角
          - type: 属性树
            changedInfo:
              - 支持模板管理、实例绑定、字段编辑及实例删除
          - type: 事件记忆
            changedInfo:
              - 支持事件提取、检索、展示、更新及删除
          - type: 事件记忆抽取配置
            changedInfo:
              - 新增事件记忆抽取配置，支持 Prompt 编辑、AI 优化、恢复默认和调试运行
          - type: Agent 多视角
            changedInfo:
              - 新增 Agent 多视角，支持为不同用户和 Agent 独立生产、更新与召回记忆
        Improvements:
          - type: 记忆列表
            changedInfo:
              - 新增属性树和事件记忆展示
          - type: 云服务控制台
            changedInfo:
              - 核心记忆接口全面适配多视角，支持按记忆视图限定生产和检索范围
              - 记忆检索支持多视图混排、统一重排及 related_id 范围过滤
              - 支持多人、多 Agent 对话场景
              - 优化异步任务的记忆变更结果查询
          - type: 调用日志
            changedInfo:
              - 新增用户与 Agent 信息，并适配属性树、事件记忆的变更记录
        Bug Fixes:
          - type: 云服务控制台
            changedInfo:
              - 修复知识库详情返回的关联项目 ID 不准确的问题
              - 修复 OpenMem 接口导入的消息误入本地聊天历史的问题
  - name: v2.0.23
    date: '2026-07-09'
    products:
      cloud:
        Improvements:
          - type: 偏好记忆模型调用
            changedInfo:
              - 兼容 Qwen3 系混合思考模型，默认关闭 thinking，提升偏好记忆模型调用稳定性
      plugin:
        New Features:
          - type: OpenClaw 本地插件
            changedInfo:
              - 新增本地记忆数据导出能力
              - 支持自动召回 Phase 1 检索参数配置
              - 支持中文关键词分词配置
              - 新增 L3 抽象专用模型配置
        Improvements:
          - type: OpenClaw 本地插件
            changedInfo:
              - 优化插件启动/注册链路
              - 优化 embedding 输入按用途路由
              - 轻量记忆模式下减少不必要的后台演化调用
              - 补充中文 README 和使用说明
        Bug Fixes:
          - type: OpenClaw 本地插件
            changedInfo:
              - 修复大数据量场景下向量扫描导致 CPU 100% 的问题
              - 修复 SQLite native binding 版本不匹配恢复问题
              - 修复 Hermes provider 链接、OpenAI-compatible endpoint 探测、FTS 查询转义、插件入口发布等稳定性问题
  - name: v2.0.22
    date: '2026-07-03'
    products:
      cloud:
        New Features:
          - type: 偏好记忆抽取
            changedInfo:
              - 支持独立模型配置
        Bug Fixes:
          - type: 偏好记忆抽取
            changedInfo:
              - 收紧偏好记忆 prompt，修复偏好记忆过度抽取问题
              - 加强偏好记忆后处理
          - type: Chat API 格式兼容
            changedInfo:
              - 新增 Chat API 的 content 字段支持字符串输入
      plugin:
        Bug Fixes:
          - type: OpenClaw 本地插件
            changedInfo:
              - 修复 OpenClaw 本地插件链路中的稳定性、召回准确性、桥接进程泄漏、配置兼容和本地记忆写入问题
              - 补充偏好记忆与自动召回相关能力
  - name: v2.0.21
    date: '2026-06-23'
    products:
      cloud:
        Improvements:
          - type: search context_format 参数更新
            changedInfo:
              - context_format 中的 heuristic_routing 模式名称改为 mixed，能力保持不变
  - name: v2.0.20
    date: '2026-06-17'
    products:
      cloud:
        Improvements:
          - type: search 支持 context_format 参数
            changedInfo:
              - 支持返回 memory / sources / heuristic_routing 3 种模式
              - memory： 返回抽取后的 memory 文本，context 更短，默认使用
              - sources：返回 memory 对应的原始 sources，更适合需要原文细节、时间、数量、顺序等问题
              - heuristic_routing：根据 query 自动选择 memory 或 sources，在控制 context 长度的同时尽量保留原文收益
          - type: 调度任务优化
            changedInfo:
              - 调整调度任务并发数限制，避免后台任务抢占 CPU、线程资源与 PolarDB 连接
              - 调整队列消费轮询间隔，降低空轮询频率与 CPU 消耗
              - 增加日志和队列开关，减少高频搜索接口的日志写入量
  - name: v2.0.19
    date: '2026-06-11'
    products:
      cloud:
        New Features:
          - type: MemOS Cloud CLI 能力增强
            changedInfo:
              - 支持 MemOS Cloud 知识库相关接口，适配 Agent 扩展至 12 个
        Improvements:
          - type: Dashboard 体验优化
            changedInfo:
              - 优化快速开始的展示逻辑
              - 新增一键接入提示词
      docs:
        Improvements:
          - type: 文档优化
            changedInfo:
              - 新增通过对话的形式为 Agent 自动接入或集成 MemOS Cloud 的指南
      plugin:
        Improvements:
          - type: 本地插件算法优化
            changedInfo:
              - 本地插件算法优化，识别不同领域任务，注入优化过的通用 prompt
  - name: v2.0.17
    date: '2026-05-21'
    products:
      cloud:
        New Features:
          - type: Dream 核心功能发布
            changedInfo:
              - fine 模式下 add 后写入 dream 相关线索到记忆节点
              - dream 阶段做 Context 上下文绑定与摘要，形成 context 节点
              - search 侧支持召回 context 节点，开关配置
              - dream diary 修复并加入 context 相关内容
              - 插件中注册 dream 并修复之前 dream 链路的部分问题
          - type: 时间敏感记忆优化
            changedInfo:
              - 补充时间相关信息的 LLM 回写方法 batch 化，减少 LLM 调用
        Bug Fixes:
          - type: Skill 生成修复
            changedInfo:
              - 修复频繁生成无意义 Skill 的问题，现在至少 5 轮工具调用历史才会触发沉淀生成
              - 调度任务丢失及 Redis 序列化修复
  - name: v2.0.16
    date: '2026-05-14'
    products:
      cloud:
        Improvements:
          - type: 关键词检索分词选取优化
            changedInfo:
              - 动态调整关键词检索时选取的分词数量，只选取特定类型的分词
          - type: 检索侧记忆版本优化
            changedInfo:
              - 检索侧记忆版本增加开关
              - 去除对效果影响不大但可能影响检索性能的额外 sidecar recall
          - type: PolarDB 数据存储优化
            changedInfo:
              - 针对单图存储所有用户数据导致的亿级数据量下检索性能劣化、并发锁竞争问题，通过对用户记忆数据进行水平拆分，并采用双写 + 读切换模式平滑迁移，有效解决亿级数据性能瓶颈
        Bug Fixes:
          - type: 记忆版本问题修复
            changedInfo:
              - 修复同一次添加 / 其他记忆添加造成多次版本更新的问题
              - 修复单元测试问题
      docs:
        Improvements:
          - type: 文档体系补全
            changedInfo:
              - 新增 docs 下的开源文档及 examples/README.md
              - OpenClaw Plugin 文档完善：新增本地插件指南、Hermes 插件说明、多 Agent 示例、recall filter 示例、插件对比与变更说明
              - 贡献者文档完善：新增根目录 CONTRIBUTING.md，补充开发环境、工作流、提交规范、测试规范、文档贡献规范等
      opensource:
        Improvements:
          - type: 测试脚本补全
            changedInfo:
              - 新增 tests/mem_feedback 和 tests/reranker
  - name: v2.0.15
    date: '2026-05-08'
    products:
      cloud:
        Improvements:
          - type: 关键词检索优化
            changedInfo:
              - 中文查询使用 jieba.analyse.extract_tags 提取高权重词，最多 12 个
              - 英文查询走 tokenizer / 正则分词，同样限制最多 12 个关键词
              - 强制校验 user_name，为空直接报错，避免跨用户大范围查询
        New Features:
          - type: 时间敏感的记忆版本
            changedInfo:
              - 写入侧抽取 timespec 和 memory_form（state/event）信息，state 类记忆走版本合并，event 类不走版本
              - 检索侧判断 query 是否与时间相关，并在相关时补充 history 版本与时间敏感 rerank
          - type: 支持用户上传 Skill
            changedInfo:
              - 用户可通过记忆添加接口上传自己的 skill，形成 skill 记忆并支持检索
              - 通过记忆搜索接口可召回上传 skill 时生成的 skill 记忆
      opensource:
        New Features:
          - type: Skill 上传支持
            changedInfo:
              - 支持将用户提供的可下载 skill 链接构建出 skill 记忆，同时支持 skill 记忆的检索
  - name: v2.0.14
    date: '2026-04-23'
    products:
      cloud:
        Bug Fixes:
          - type: 记忆版本
            changedInfo:
              - 修复记忆版本对同一段 memory 原文分出的 chunks 之间也会生效的 bug
      opensource:
        New Features:
          - type: 引入插件机制
            changedInfo:
              - 引入轻量级插件框架，支持通过 @hookable 钩子机制和 entry_points 自动发现，将可选功能从核心代码中解耦为独立可插拔模块
        Improvements:
          - type: 调度任务优化
            changedInfo:
              - message_pack_cache 加容量上限，支持动态调整
              - 拉数据拆分为短锁 + 无锁 + 短锁，Redis I/O 不再阻塞消费线程
              - 增加 _refill_in_progress 标记与双重检查，避免重复拉取
              - seen_streams 定期清理不活跃 key
              - _empty_stream_seen_times 定期清理孤儿记录
              - Redis 调用移出锁外，锁内只操作内存
        Bug Fixes:
          - type: PolarDB 与 MemReader
            changedInfo:
              - 修复 PolarDB get_node 和 get_nodes 的 metadata 嵌套 bug
              - 修复 memreader chunking bug
          - type: 大模型输出 JSON 解析
            changedInfo:
              - 修复大模型输出 JSON 解析问题（#1526）
  - name: v2.0.13
    date: '2026-04-09'
    products:
      cloud:
        Improvements:
          - type: 服务优化
            changedInfo:
              - 调度日志分级优化：将高频、重复、逐条打印的日志从 info 下调到 debug
              - 队列日志结构化：本地队列和 Redis 队列日志统一为结构化字段
              - 调度链路关键路径可观测：补齐「提交 -> 出队 -> 分发」关键节点的摘要日志
  - name: v2.0.12
    date: '2026-04-02'
    products:
      cloud:
        Improvements:
          - type: 服务优化
            changedInfo:
              - 新增最小线程数为可配置参数，支持运行时动态调整线程池大小，有效控制活跃连接数
              - 记忆版本分流机制优化，改为用 LLM 分流，提升分流准确率并大幅提升 skip 记忆版本的 case 召回
  - name: v2.0.11
    date: '2026-03-26'
    products:
      opensource:
        New Features:
          - type: LLM 与搜索能力
            changedInfo:
              - 新增 MiniMax 作为 LLM Provider（#1291）
              - 新增 health check API 端点（#1248）
              - delete_memory 接口支持 user_id 和 conversation_id 过滤条件（#1104）
              - 新增 Tavily 作为可插拔的互联网搜索后端（#1357）
              - 新增生产级 Dockerfile 和 Kubernetes Helm Chart（#1293）
        Improvements:
          - type: 调度与服务优化
            changedInfo:
              - '优化线程池调度策略，改善内存使用率（#1326, #1363）'
              - 优化 PolarDB export_graph 执行路径（#1337）
              - 改进 API 校验错误信息，返回内容包含请求上下文（#1350）
          - type: API 重构
            changedInfo:
              - 整合分散的 API 接口至 server_api，移除已废弃的 Nebula 图数据库支持及旧版 product/core 文件（#1344）
        Bug Fixes:
          - type: 数据库与记忆
            changedInfo:
              - 修复 Neo4j 向量搜索 pre-filter 逻辑（#1359）
              - 修复嵌套 metadata 写入问题（#1178）
              - 修复 feedback 后记忆节点被误归档导致无法检索的问题（#1243）
          - type: MCP 与 API
            changedInfo:
              - 修复 MCP add_memory 工具消息格式问题（#1275）
              - 修复 get_further_suggestion 无法处理 string 类型输入参数的问题（#1218）
  - name: v2.0.10
    date: '2026-03-19'
    products:
      cloud:
        Improvements:
          - type: PolarDB 底层数据库
            changedInfo:
              - PolarDB 优化升级，针对多种过滤条件的查询路径进行优化，查询数倍加速
              - MemReader 模型更新为 0.6B 小模型，单次请求与高并发延迟显著降低
          - type: 记忆版本服务优化
            changedInfo:
              - 记忆版本插件化
              - NLI 模型添加高可用
              - memreader 处记忆版本增加路由，无关召回走旧 prompt 和模型，否则走记忆版本插件（qwen-flash）
          - type: 服务优化
            changedInfo:
              - 调度任务优化改进，改善内存使用率情况
  - name: v2.0.9
    date: '2026-03-13'
    products:
      cloud:
        Improvements:
          - type: 记忆版本
            changedInfo:
              - 记忆版本兼容 feedback：feedback 对节点更新时走记忆版本逻辑，旧内容推到 history 字段
              - 全面优化「恢复过去版本当中的独立事实」链路，更稳定准确地恢复独立事实
        Bug Fixes:
          - type: 记忆版本与 feedback
            changedInfo:
              - 记忆版本参数校验、更新后 key 为空、update 时间错误的 bug 修复
              - feedback 过程中 sources 为空的问题修复
  - name: v2.0.8
    date: '2026-03-05'
    products:
      cloud:
        New Features:
          - type: 记忆版本
            changedInfo:
              - 添加记忆时自动对冲突 / 重复记忆进行检测、合并和归档，保留最新记忆内容，并将旧记忆内容放在历史字段中（本次将开关打开）
        Improvements:
          - type: 偏好记忆迁移到图数据库
            changedInfo:
              - 偏好记忆迁移到图数据库，和其他记忆类型统一
          - type: 记忆版本优化
            changedInfo:
              - 记忆版本功能完全迁移到异步执行，不影响 async_mode=true 时的 addMessage 接口时延
          - type: 记忆检索
            changedInfo:
              - 记忆检索减少重复调用 get_by_metadata，降低了记忆检索耗时
        Bug Fixes:
          - type: 记忆添加与检索
            changedInfo:
              - 修复 MultiModalStruct 在 fast 模式下部分情况未进行 embedding 导致无法被搜索的问题
              - 修复图片类记忆没有单独解读图片内容的 bug
              - 修复记忆版本在并发 add 情况下按时间顺序依次合并处理的问题
      opensource:
        Improvements:
          - type: 性能优化
            changedInfo:
              - 全文检索预热：通过触发式预热将热数据加载至缓存
              - 线程池弹性控制：采用信号量实现精细化并发限流
              - 数据库日志精简：优化日志级别与内容，降低日志写入对数据库性能的影响
  - name: v2.0.7
    date: '2026-02-27'
    products:
      cloud:
        New Features:
          - type: 记忆版本
            changedInfo:
              - 添加记忆时自动对冲突 / 重复记忆进行检测、合并和归档，保留最新记忆内容，并将旧记忆内容放在历史字段中
        Improvements:
          - type: 记忆检索 relativity 参数
            changedInfo:
              - search 接口和 chat 接口的 relativity 参数默认值修改为 0.45
          - type: 日志优化
            changedInfo:
              - 拦截部分日志报错，对部分日志级别进行调整
        Bug Fixes:
          - type: 偏好记忆 embedding
            changedInfo:
              - 修复检索时获取偏好记忆 embedding 错误，缺失 embedding 时只计算缺失部分而非全量重算
  - name: v2.0.6
    date: '2026-02-11'
    products:
      cloud:
        New Features:
          - type: search 检索优化
            changedInfo:
              - 事实记忆召回时新增一路关键词召回，relativity 仍使用 embedding 相似度
          - type: chat 支持 relativity
            changedInfo:
              - chat 接口加入 relativity 字段，用户可使用 relativity 控制聊天中的检索阈值
        Bug Fixes:
          - type: 接口与模型适配
            changedInfo:
              - 修复偏好记忆阈值筛选使用字段错误的问题
              - 修复 get_memory 接口 filter 参数同时传入 field condition 和 AND/OR/NOT 时调用失败或卡顿的问题
              - 修复 LLM extra body 传入问题，兼容 enable thinking 参数输入
      opensource:
        New Features:
          - type: 多视角记忆
            changedInfo:
              - 让每个 agent 记忆体拥有自己的主观视角记忆世界
          - type: 多视角记忆 DEMO
            changedInfo:
              - 基于多视角的小游戏「冲顶鳌太线」，组队冲顶
  - name: v2.0.5
    date: '2026-02-09'
    products:
      cloud:
        New Features:
          - type: search 接口 relativity 字段
            changedInfo:
              - search 接口新增 relativity 字段（0~1），支持按相关性分数筛选召回的记忆
        Improvements:
          - type: Skills 优化
            changedInfo:
              - 技能文档支持本地保存并生成专属访问 URL
              - 能够从用户添加的历史信息中生成更丰富完整的 skills
      plugin:
        New Features:
          - type: MindDock 云服务 Skill
            changedInfo:
              - 插件页面添加跳转 Skill 的入口
              - chatBot 实时聊天注入的 prompt 中新增 Skill 模块，让各模型历史沉淀的 Skill 在所有 chatBot 中互通
      mcp:
        New Features:
          - type: MCP 记忆删除
            changedInfo:
              - 识别删除意图后同时走 deleteMemory 和 addFeedback 两条路径
      playground:
        Bug Fixes:
          - type: Playground 优化
            changedInfo:
